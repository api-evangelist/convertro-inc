name: Convertro, Inc.
description: 'Convertro, Inc. was a marketing analytics company based in Santa Monica, California,
  providing a multi-touch attribution platform that measured the ROI of marketing touchpoints across
  online and offline media using algorithmic attribution models. Backed by Bessemer Venture Partners,
  Convertro was acquired by AOL in 2014 and folded into the AOL/Verizon (now Yahoo) advertising stack.
  It no longer operates an independent public developer surface: convertro.com redirects to yahooinc.com,
  and no developer portal, documentation, API, or reachable API host was found during enrichment. This
  profile is retained as a network record; there is no live provider API surface to enrich.'
